# Basque student: depth-distil the 24-layer Basque teacher into the 6-layer release model
# (official training/configs/depth_distill.yaml, CFG baked in).
model_config: pocket_tts/config/english.yaml          # 6-layer student architecture
model_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece
  flow_lm.lookup_table.tokenizer_path: /root/data/bssd/tokenizer/basque.model
start_from_pretrained: false
distill_cfg_coef: 2.0
distill_teacher_config: pocket_tts/config/english_2026-04_24l.yaml
distill_teacher_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece
  flow_lm.lookup_table.tokenizer_path: /root/data/bssd/tokenizer/basque.model
distill_teacher_weights: /root/runs/basque_24l/keep/checkpoint_00040000.pt   # chosen after the 40k-80k comparison (reports/teacher_compare.md)

data:
  train_jsonl: /root/data/bssd/train_aligned.jsonl
  valid_jsonl: /root/data/bssd/dev_aligned.jsonl

flow:
  type: lsd
  kwargs: {}

text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 1000

run_dir: /root/runs/basque_6l
batch_size: 64
grad_accum_steps: 1
max_steps: 150000
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 3
sample_sentences:
  - "Kaixo, nola zaude gaur?"
  - "Euskara munduko hizkuntzarik zaharrenetarikoa da, eta Euskal Herrian hitz egiten da."
sample_freq: 5000
sample_temp: 0.3
sample_cfg_coef: 1.0
