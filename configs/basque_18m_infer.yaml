# Inference config for the 18M Basque student (8 L × 512, z_dim 64, teacher LSD head) used by the eval loop.
# Local paths on the training VM.
weights_path: /root/runs/basque_18m/model.safetensors
default_temperature: 0.3
flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 512
    hidden_scale: 1
    max_period: 10000
    num_heads: 8
    num_layers: 8
  lookup_table:
    dim: 512
    n_bins: 4000
    tokenizer: sentencepiece
    tokenizer_path: /root/data/bssd/tokenizer/basque.model
  z_dim: 64
mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
