# Basque teacher: fine-tune the English 24-layer Pocket TTS teacher with a fresh Basque tokenizer
# (official "new language" recipe, training/configs/finetune_language.yaml). Run from the
# pocket-tts checkout:  uv run training/train.py ../pocket-tts-eu/configs/basque_24l_finetune.yaml
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece        # the 24L base config says "tokenizers" (json); ours is a .model
  flow_lm.lookup_table.tokenizer_path: /root/data/bssd/tokenizer/basque.model
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: /root/data/bssd/train_aligned.jsonl
  valid_jsonl: /root/data/bssd/dev_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: constant
  warmup_steps: 1000

run_dir: /root/runs/basque_24l
batch_size: 32          # fits a 46 GB GPU; effective batch 64 with grad_accum 2
grad_accum_steps: 2
max_steps: 80000        # WER plateaus ~15k; stop early on dev WER / UTMOS
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 3
sample_sentences:
  - "Kaixo, nola zaude gaur?"
  - "Euskara munduko hizkuntzarik zaharrenetarikoa da, eta Euskal Herrian hitz egiten da."
  - "Bihar goizeko hamarretan hasiko da bilera, Donostiako udaletxean."
  - "Zenbat balio du sarrerak? Hogeita bost euro, haurrentzat hamabi."
sample_freq: 5000
sample_temp: 0.3
sample_cfg_coef: 2.0
