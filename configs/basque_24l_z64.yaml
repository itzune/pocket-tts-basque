# Step 2 of TRAINING_PLAN_SMALL.md: narrow the Basque teacher's backbone→head interface to 64 dims.
# Start: /root/runs/basque_24l_z64/checkpoint_00000000.pt written by scripts/small/narrow_teacher_z64.py
# (PCA z_proj folded into the heads), picked up by the trainer's auto-resume. Kyutai: 30k steps, the
# teacher barely changes (UTMOS 4.24 vs 4.27) and becomes distillable by small students.
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece
  flow_lm.lookup_table.tokenizer_path: /root/data/bssd/tokenizer/basque.model
  flow_lm.z_dim: 64
start_from_pretrained: false

data:
  train_jsonl: /root/data/bssd/train_aligned.jsonl
  valid_jsonl: /root/data/bssd/dev_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 5e-5          # between the fine-tune rate (2e-5) and the teacher's 2e-4: the folded heads are a good init
  schedule: constant
  warmup_steps: 500

run_dir: /root/runs/basque_24l_z64
batch_size: 32
grad_accum_steps: 2
max_steps: 30000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 3
sample_sentences:
  - "Kaixo, nola zaude gaur?"
  - "Euskara munduko hizkuntzarik zaharrenetarikoa da, eta Euskal Herrian hitz egiten da."
  - "Bihar goizeko hamarretan hasiko da bilera, Donostiako udaletxean."
  - "Zenbat balio du txartel horrek? Hogeita bost euro."
sample_freq: 5000
sample_temp: 0.3
sample_cfg_coef: 2.0
