# Teacher v2 (TRAINING_PLAN_V2.md stage 2): English 24-layer model fine-tuned for Basque on BSSD v2
# (v1 minus palatal rows + ~580 h new synthetic + 47 h real studio/crowd speech over-sampled), with a
# cosine schedule to a fixed length instead of constant LR + early stop (phase 1 drifted after 40k).
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer: sentencepiece
  flow_lm.lookup_table.tokenizer_path: /root/data/bssd_v2/tokenizer/basque_v2.model
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: /root/data/bssd_v2/train_aligned.jsonl
  valid_jsonl: /root/data/bssd/dev_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}
flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: cosine
  warmup_steps: 2000

run_dir: /root/runs/basque_24l_v2
batch_size: 32
grad_accum_steps: 2
max_steps: 150000
stats_ema_steps: 1000
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 2
sample_sentences:
  - "Kaixo, nola zaude gaur?"
  - "Antton eta Maddi onddo bila joan dira basora."
  - "Bihar goizeko hamarretan hasiko da bilera, Donostiako udaletxean."
  - "Zenbat balio du txartel horrek? Hogeita bost euro."
sample_freq: 5000
sample_temp: 0.3
sample_cfg_coef: 2.0
